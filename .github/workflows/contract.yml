name: Backend contract

on: [pull_request]

jobs:
  contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pryti-contract

      - name: Export contract (this PR)
        run: pryti-contract export --settings ${{ vars.DJANGO_SETTINGS_MODULE }} -o head.json

      - name: Export contract (base branch)
        run: |
          git stash --include-untracked || true
          git checkout ${{ github.event.pull_request.base.sha }}
          pryti-contract export --settings ${{ vars.DJANGO_SETTINGS_MODULE }} -o /tmp/base.json
          git checkout -
          cp /tmp/base.json base.json

      - name: Diff
        id: diff
        run: |
          pryti-contract diff base.json head.json --markdown > comment.md || echo "risky=1" >> "$GITHUB_OUTPUT"
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync('comment.md', 'utf8'),
            });

      - name: Fail on risky changes
        if: steps.diff.outputs.risky == '1'
        run: |
          echo "Risky contract changes need a human. See the PR comment."
          exit 1
